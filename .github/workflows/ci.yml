# CI/CD for NextGeneration Class.
# CI: builds and tests the API and the Flutter app on every push and pull request (GitHub's machines).
# CD: every push to main with both test jobs green goes online, from GitHub's own machines (no runner of ours):
#     1. "Deploy the server" runs infra/deploy.sh over SSH: backup, then the API, database and Caddy rebuilt
#        with the server's own infra/.env (no app secret in GitHub).
#     2. "Deploy the web app" uploads the same tested web build to the Cloudflare Worker (infra/cloudflare).
#     Set up once in Settings (docs/05-deployment/08-CI_DEPLOY.md): environment "production" with the secrets
#     DEPLOY_SSH_KEY and CLOUDFLARE_API_TOKEN, the variables DEPLOY_HOST, DEPLOY_KNOWN_HOSTS and
#     CLOUDFLARE_ACCOUNT_ID. A job whose settings are missing is skipped, never half run.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button in the Actions tab (deploys only when started on main)

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A newer push on a branch cancels the older run of that branch, except on main,
# where a deploy must never be cut in the middle.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21 (Temurin, same as the Dockerfile)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven   # reuses ~/.m2 between runs, so dependencies are not downloaded every time

      # Docker is preinstalled on ubuntu-latest, so Testcontainers can start its PostgreSQL here too.
      - name: Build and run the tests
        run: mvn -B verify

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Flutter (the version the project is built with)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.x'
          cache: true

      - name: Get the packages
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run the tests
        run: flutter test --concurrency=4

      # No API_BASE_URL: a release web build calls its own address + /api/v1, which Caddy sends to the API
      # (app/lib/core/config/app_config.dart).
      - name: Build the web app
        run: flutter build web --release --pwa-strategy=none

      # Handed to both deploy jobs: the server bakes it into the Caddy image (app/web.Dockerfile),
      # Cloudflare serves it on the main address.
      - name: Keep the web build for the deploy jobs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: app/build/web
          retention-days: 3

  deploy-server:
    name: Deploy the server
    needs: [backend, app]
    # Only main, only from a push or a manual start, never a pull request (the repository is public: a fork must
    # never reach the server). Skipped until DEPLOY_HOST is set.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    # The secrets live in this environment only; it also lists every deployment in the repository's "Deployments".
    environment: production
    # One deploy at a time, and never cut in the middle by a newer push.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the web build tested by the App job
        uses: actions/download-artifact@v4
        with:
          name: web
          path: app/build/web

      # The private key only exists here, for this run; only the server's pinned key is accepted.
      - name: Prepare the SSH access
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ngclass_deploy
          chmod 600 ~/.ssh/ngclass_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Backup of the running platform first, then the rebuild; fails if the API never answers UP.
      - name: Deploy (infra/deploy.sh)
        env:
          SSH_STRICT: 'yes'
          DEPLOY_BRANCH: ${{ github.ref_name }}
          SKIP_WEB_BUILD: '1'
        run: SSH_KEY="$HOME/.ssh/ngclass_deploy" ./infra/deploy.sh "${{ vars.DEPLOY_USER || 'ubuntu' }}@${{ vars.DEPLOY_HOST }}" < /dev/null

      - name: Check the API answers from outside
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://api.nextgenerationclass.online/health

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/ngclass_deploy

  deploy-web:
    name: Deploy the web app
    needs: [backend, app, deploy-server]
    # After the server (the new screens may need the new API). Runs when the server deploy passed, or was skipped
    # because it is not set up; never after a failed one. Skipped until CLOUDFLARE_ACCOUNT_ID is set.
    if: >-
      !failure() && !cancelled()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the web build tested by the App job
        uses: actions/download-artifact@v4
        with:
          name: web
          path: app/build/web

      - name: Install Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The token can only edit Workers on this account ("Edit Cloudflare Workers" template).
      - name: Upload to the Cloudflare Worker
        working-directory: infra/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Check the site answers
        run: |
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null https://nextgenerationclass.online/
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors https://nextgenerationclass.online/health
